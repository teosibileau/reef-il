[project]
name = "reef-il"
version = "0.1.0"
description = "Refill full-line # comments and docstring prose to the configured line length, as a pre-commit hook."
readme = "README.md"
license = "MIT"
authors = [{ name = "Teo Sibileau" }]
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/teosibileau/reef-il"
Changelog = "https://github.com/teosibileau/reef-il/releases"

[project.scripts]
reef-il = "reefil.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reefil"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
